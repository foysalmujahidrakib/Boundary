name: boundary
description: >-
  Boundary — cricket club, tournament and live-scoring app.
  A Flutter port of the Boundary web app (same Firebase project).
publish_to: none
version: 1.0.0+1

environment:
  # Compatible with the Flutter SDK bundled in this workspace (Dart 3.11).
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # Firebase — the same project/backend as the web app.
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0
  firebase_storage: ^13.0.0
  image_picker: ^1.1.2

  # DM Sans / Manrope / Anton, the fonts used by the web CSS.
  google_fonts: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.png

flutter_launcher_icons:
  image_path: "assets/icon/icon.png"

  android: true
  ios: true
  remove_alpha_ios: true

  adaptive_icon_background: "#0B121E"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"

  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#0B121E"
    theme_color: "#00FFC2"
