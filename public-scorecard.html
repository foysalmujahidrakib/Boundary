<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Scorecard | Boundary</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    :root {
      --theme-bg: #0B121E;
      --theme-surface: #111C2D;
      --theme-accent: #00FFC2;
      --theme-alert: #FF5E1E;
      --theme-text: #FFFFFF;
      --theme-muted: #64748B;
      --theme-positive: #10B981;
      --theme-border: rgba(100, 116, 139, .35);
    }

    .public-report {
      max-width: 1080px;
      margin: 34px auto;
      padding: 0 22px 50px;
    }

    .public-report-hero {
      background: var(--theme-surface);
      color: var(--theme-text);
      border-radius: 18px;
      padding: 26px;
      margin-bottom: 20px;
      border: 1px solid var(--theme-border);
    }

    .public-report-hero h1 {
      font: 800 26px Manrope, sans-serif;
      margin: 10px 0;
    }

    .public-report-meta {
      color: var(--theme-muted);
      font-size: 13px;
    }

    .public-report-result {
      font-weight: 800;
      color: var(--theme-positive);
      margin-top: 14px;
    }

    .public-report-scores {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 20px;
    }

    .public-report-team {
      background: rgba(100, 116, 139, .16);
      border: 1px solid var(--theme-border);
      border-radius: 12px;
      padding: 14px 16px;
      min-width: 180px;
    }

    .public-report-team strong {
      display: block;
      font: 800 24px Manrope;
      margin-top: 5px;
      color: var(--theme-text);
    }

    .public-report-card {
      background: var(--theme-surface);
      border: 1px solid var(--theme-border);
      border-radius: 16px;
      padding: 22px;
      margin: 18px 0;
    }

    .public-report-card h2 {
      font: 700 18px Manrope;
      margin: 0 0 14px;
      color: var(--theme-text);
    }

    .public-report-card h3 {
      font: 700 14px Manrope;
      margin: 18px 0 8px;
      color: var(--theme-text);
    }

    .public-table-wrap {
      overflow-x: auto;
    }

    .public-table {
      width: 100%;
      border-collapse: collapse;
      min-width: 480px;
      font-size: 13px;
    }

    .public-table th,
    .public-table td {
      padding: 10px 9px;
      text-align: right;
      border-bottom: 1px solid var(--theme-border);
      white-space: nowrap;
      color: var(--theme-text);
    }

    .public-table th:first-child,
    .public-table td:first-child {
      text-align: left;
    }

    .public-table th {
      font-size: 10px;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--theme-muted);
      background: rgba(100, 116, 139, .16);
    }

    .public-table tfoot td {
      font-weight: 800;
      background: rgba(100, 116, 139, .12);
    }

    .public-muted {
      font-size: 12px;
      color: var(--theme-muted);
    }

    .public-empty {
      padding: 24px;
      text-align: center;
      background: rgba(100, 116, 139, .12);
      border-radius: 12px;
      color: var(--theme-muted);
      border: 1px solid var(--theme-border);
    }

    .public-summary {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
    }

    .public-summary-item {
      padding: 14px;
      border-radius: 11px;
      background: rgba(100, 116, 139, .16);
      border: 1px solid var(--theme-border);
    }

    .public-summary-item small {
      display: block;
      color: var(--theme-muted);
    }

    .public-summary-item strong {
      font: 800 21px Manrope;
      color: var(--theme-text);
    }

    @media(max-width:640px) {
      .public-report-hero h1 {
        font-size: 22px;
      }

      .public-report-card {
        padding: 16px;
      }
    }
  </style>
</head>

<body class="dashboard-body">
  <header class="dash-topbar">
    <a class="brand" href="index.html"><span class="brand-mark">B</span> boundary<span class="brand-dot">.</span></a>
    <div class="dash-user"><a class="btn btn-ghost btn-small" href="index.html#liveMatches">← All live matches</a></div>
  </header>
  <main class="public-report">
    <div id="publicNotice" class="public-empty">Loading public scorecard…</div>
    <section id="publicMatchHero" class="public-report-hero" hidden>
      <div class="eyebrow"><span></span> <span id="publicStatus">LIVE SCORE</span></div>
      <h1 id="publicMatchTitle"></h1>
      <div id="publicMatchMeta" class="public-report-meta"></div>
      <div id="publicResult" class="public-report-result"></div>
      <div id="publicHeadlineScores" class="public-report-scores"></div>
    </section>
    <div id="publicInningsReports"></div>
    <section class="public-report-card">
      <h2>Match summary</h2>
      <div id="publicMatchSummary" class="public-summary"></div>
    </section>
  </main>
  <script type="module" src="js/public-scorecard.js"></script>
</body>

</html>
